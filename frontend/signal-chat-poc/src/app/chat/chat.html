<div class="chat-window">
  @for (msg of messages(); track msg) {
    <div [ngClass]="{ 'received-message': msg.type === ChatMessageType.Received, 'send-message': msg.type === ChatMessageType.Send }">
      {{msg.content}}
    </div>
  }
</div>
<app-message (messageSent)="onSendMessage($event)"/>
<br>
<app-group [(activeGroupMode)]="activeGroupMode" (joinedToGroup)="onAddToGroup($event)" (removedFromGroup)="onRemoveFromGroup($event)" />
