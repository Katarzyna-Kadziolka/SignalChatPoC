<select [(ngModel)]="activeGroupMode">
  @for (mode of groupModes(); track mode) {
    <option [value]="mode">{{mode}}</option>
  })
</select>
<br>
<app-base-input (enterClicked)="joinGroup($event)" placeholder="Add to group"/>
<br>
<app-base-input (enterClicked)="removeFromGroup($event)" placeholder="Remove from group"/>
